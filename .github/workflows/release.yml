name: release

# A tag v<version> builds both packages with build-packages.yml in STRICT mode: each engine
# measured in its final package must be in TRUSTED_BUILDS (pinned by a reviewed commit,
# after qualify.yml), the same in two independent builds, and reported trusted by the app.
# Only when everything passed does the last job create a DRAFT release with every file
# attached, then download them again and check them against SHA256SUMS. The maintainer
# reviews the draft and makes it public by hand: nothing becomes public here.
#
# Attached: the freeglaz tarball (tracked source + built front: the end user needs no
# Node), the macOS .dmg (Apple Silicon), the Flatpak bundle (x86_64), the Corresponding
# Source of chartread-fgK (with the official ArgyllCMS source zip inside), that ArgyllCMS
# source zip on its own, SHA256SUMS, and the qualification report (provenance: toolchains,
# commits, engine sha256). A release candidate tag (v0.1.17-rc.2) is a pre-release that never
# becomes "Latest".
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  packages:
    uses: ./.github/workflows/build-packages.yml
    permissions:
      contents: read
    with:
      ref_name: ${{ github.ref_name }}
      mode: strict

  draft:
    name: Draft release (every file verified)
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the draft release and attach its files
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.packages.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '{qualification,sources,macos-a,flatpak-a}'
          path: _ci
      - name: Strict qualification passed, files match it
        run: |
          set -euo pipefail
          test "${{ needs.packages.outputs.mode }}" = strict
          python3 - <<'PY'
          import json, sys
          q = json.load(open("_ci/qualification/qualification.json"))
          ok = q["mode"] == "strict" and q["verdict"] == "pass" and q["approved"] is True
          ok = ok and not any("UNAPPROVED" in f for f in q["deliverables"])
          print(json.dumps({k: q[k] for k in ("version", "mode", "verdict", "approved", "problems")}, indent=1))
          sys.exit(0 if ok else 1)
          PY
          mkdir rel
          while read -r _ file; do
            src=$(find _ci -type f -name "$file" | head -1)
            [ -n "$src" ] || { echo "::error::$file not found in the artifacts"; exit 1; }
            cp "$src" "rel/$file"
          done < _ci/qualification/SHA256SUMS
          cp _ci/qualification/SHA256SUMS rel/SHA256SUMS
          cp _ci/qualification/qualification.json "rel/freeglaz-${VERSION}-build-provenance.json"
          (cd rel && sha256sum -c SHA256SUMS)
          ls -l rel
      - name: Create the draft release
        run: |
          set -euo pipefail
          n=$(gh api "repos/$GH_REPO/releases?per_page=100" --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          if [ "$n" != 0 ]; then
            echo "::error::a release or draft for $TAG already exists: nothing is replaced"; exit 1; fi
          case "$TAG" in
            v*-rc.*) gh release create "$TAG" rel/* --draft --verify-tag --generate-notes --prerelease --latest=false ;;
            *)       gh release create "$TAG" rel/* --draft --verify-tag --generate-notes ;;
          esac
      - name: Download the draft's files again and check them
        run: |
          set -euo pipefail
          id=$(gh api "repos/$GH_REPO/releases?per_page=50" \
               --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -1)
          [ -n "$id" ] || { echo "::error::draft release $TAG not found"; exit 1; }
          mkdir back
          gh api "repos/$GH_REPO/releases/$id/assets?per_page=100" --jq '.[] | "\(.id) \(.name)"' |
          while read -r aid name; do
            gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$aid" > "back/$name"
          done
          (cd back && sha256sum -c SHA256SUMS)
          test "$(ls back | wc -l)" = "$(ls rel | wc -l)"
          {
            echo "### Draft release $TAG ready"
            echo
            echo "Every file was downloaded again and matches SHA256SUMS. Review the draft, edit its"
            echo "notes, then make it public by hand."
            echo; echo '```'; cat rel/SHA256SUMS; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
