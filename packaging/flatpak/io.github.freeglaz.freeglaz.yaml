# Flatpak manifest for freeglaz — self-contained (deps + libvips + ArgyllCMS
# bundled, zero external dependency). Built and validated on Fedora 42 / GNOME 50.
#
# Build (on Linux):
#   flatpak install flathub org.gnome.Platform//50 org.gnome.Sdk//50 org.flatpak.Builder
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#       build-dir packaging/flatpak/io.github.freeglaz.freeglaz.yaml
#   flatpak run io.github.freeglaz.freeglaz
#
# To refresh python3-deps.yaml (new lock), see packaging/flatpak/README.md §2 —
# the --prefer-wheels / --ignore-installed flags there are REQUIRED (compiled
# packages must use wheels; packages present in the SDK, e.g. lxml, must be
# forced into /app).
app-id: io.github.freeglaz.freeglaz
runtime: org.gnome.Platform
runtime-version: '50'          # GNOME 50 ships WebKitGTK (pywebview) + libtiff/jpeg/png (Argyll)
sdk: org.gnome.Sdk
command: freeglaz

finish-args:
  - --share=network            # reach the Z9 over the network
  - --socket=wayland
  # X11 (not fallback-x11): desktop.py forces GDK_BACKEND=x11 (Wayland-crash
  # workaround), so the X socket must be exposed even on a Wayland session.
  - --socket=x11
  - --share=ipc
  - --device=dri               # GPU for WebKitGTK compositing
  - --filesystem=xdg-documents # ~/Documents/freeglaz (user-facing profiles/backups)
  # File open/save go through the portals (file chooser) → no broad fs access.

cleanup:
  - /include
  - /lib/pkgconfig
  - '*.a'
  - '*.la'

modules:
  # Python dependencies — generated from uv.lock (see README §2). Pinned wheels,
  # offline build.
  - python3-deps.yaml

  # ArgyllCMS — BUNDLED (prebuilt relocatable Linux binaries; all deps resolve
  # against the GNOME runtime). The user needs no external install.
  - name: argyll
    buildsystem: simple
    build-commands:
      - mkdir -p /app/argyll
      - cp -r bin ref /app/argyll/
    sources:
      - type: archive
        url: https://www.argyllcms.com/Argyll_V3.5.0_linux_x86_64_bin.tgz
        sha256: 0d1da052de22396f4141c5ca3ee0c17a434bc142048a327dd86565a9f20d0c13
        strip-components: 1

  # freeglaz itself — from the release tarball (the built frontend is inside, so
  # no Node at build time). The launcher points FREEGLAZ_ARGYLL_ROOT at /app/argyll
  # and FREEGLAZ_DATA_DIR at the writable XDG data dir (see freeglaz-launcher.sh).
  - name: freeglaz
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/freeglaz
      - cp -r lib webapp freeglaz /app/share/freeglaz/
      - install -Dm755 packaging/flatpak/freeglaz-launcher.sh /app/bin/freeglaz
      - install -Dm644 packaging/flatpak/io.github.freeglaz.freeglaz.desktop
          /app/share/applications/io.github.freeglaz.freeglaz.desktop
      - install -Dm644 packaging/flatpak/io.github.freeglaz.freeglaz.metainfo.xml
          /app/share/metainfo/io.github.freeglaz.freeglaz.metainfo.xml
      - install -Dm644 webapp/icons/freeglaz.svg
          /app/share/icons/hicolor/scalable/apps/io.github.freeglaz.freeglaz.svg
    sources:
      - type: archive
        url: https://github.com/freeglaz/freeglaz/releases/download/v0.1.4/freeglaz-0.1.4.tar.gz
        sha256: e3330973edfb35593ffff9d591ae5b834401607ad47f9b33a09499b005f31ac0
        strip-components: 1
      - type: dir
        path: .
        dest: packaging/flatpak
