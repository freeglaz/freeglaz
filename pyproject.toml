[project]
name = "freeglazcli"
version = "0.1.8"
description = "Open CLI and web app to drive the HP DesignJet Z9: printing, calibration and custom ICC color profiling."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
authors = [
    { name = "Vincent FISCHER", email = "265357873+vnz56@users.noreply.github.com" },
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.13",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.136.1",
    "lxml>=6.1.1",
    "numpy>=2.4.6",
    "pikepdf>=10.7.1",
    "pillow>=12.2.0",
    "pypdfium2>=5.8.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "pyvips[binary]>=3.1.1",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scipy>=1.13",
    "sse-starlette>=3.4.4",
    "tifffile>=2026.5.15",
    "tomli-w>=1.0",
    "uvicorn[standard]>=0.47.0",
]

[project.urls]
Homepage = "https://github.com/freeglaz/freeglaz"
Repository = "https://github.com/freeglaz/freeglaz"

[project.optional-dependencies]
# App de bureau (fenêtre native pywebview). Optionnel : le backend headless,
# les tests et la CLI n'en ont pas besoin (et ça évite d'imposer les libs GTK
# sur un Linux serveur). Install : `uv sync --extra desktop`.
# ⚠️ Projet VIRTUEL pour uv (pas de [build-system]) : NE PAS faire
# `uv pip install -e .[desktop]` (tenterait de builder le projet → échec
# auto-découverte flat-layout). `uv sync --extra` ajoute l'extra sans builder.
# Linux exige EN PLUS les libs système WebKitGTK (cf script d'install, Inc 3).
desktop = [
    "pywebview>=5.3",
    # pywebview pulls `bottle` (transitive). bottle 0.13.x supports Python 3.13
    # (0.12.x imports the removed stdlib `cgi` → breaks), BUT its published WHEEL
    # is broken: it installs bottle.py into bin/ instead of site-packages, so
    # `import bottle` fails and pywebview crashes at startup. The sdist builds
    # correctly → we force bottle from source via [tool.uv] no-binary-package.
    "bottle>=0.13",
]

[tool.uv]
# Force bottle from sdist: its 0.13.x wheel misplaces bottle.py into bin/
# (see the desktop extra comment above). The sdist installs it correctly.
no-binary-package = ["bottle"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
